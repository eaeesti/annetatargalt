# Checks the site, then builds its image and publishes it as
# ghcr.io/<owner>/annetatargalt-site, tagged with the commit and as "main",
# on every push to main that changes it. The build reads the backend's public
# content (the sitemap and the manifest are made then), with an API token
# from the repository's secrets: a build secret, never written into the
# image. The other build settings are public values.
# Never on pull requests, whose workflows run code from outside.
# Actions are pinned to commit shas; the comment says which release.
name: Site image

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/site-image.yml"
  workflow_dispatch:

concurrency:
  group: site-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # pnpm at the version package.json's packageManager pins
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/annetatargalt-site:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/annetatargalt-site:main
          # Which commit an image is, for whoever runs it.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://annetatargalt.ee
            NEXT_PUBLIC_STRAPI_API_URL=https://strapi.annetatargalt.ee
            PLAUSIBLE_DOMAIN=annetatargalt.ee
            UMAMI_WEBSITE_ID=9f633760-80ac-4af4-b80a-992a83e9f7bd
          secrets: |
            strapi_api_token=${{ secrets.STRAPI_API_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
